services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:${LOCAL_AI_API_PORT:-18765}:8000"
    volumes:
      - local_ai_data:/data
      - type: bind
        source: ${LOCAL_AI_MODELS_DIR:-./models_storage}
        target: /models
        read_only: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_AI_WEB_PORT:-8080}:80"

volumes:
  local_ai_data:
