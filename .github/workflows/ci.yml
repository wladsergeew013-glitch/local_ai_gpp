name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    name: Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-base.txt
      - run: python -m pip install -r backend/requirements-base.txt
      - run: python -m unittest discover -s tests -v
  docker:
    name: Docker Linux / web / API
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose -p local-ai-ci up -d --build --wait --wait-timeout 180
      - name: Check web bundles, API, OpenAPI and branding proxy
        run: python3 tools/check_docker.py
      - name: Logs
        if: always()
        run: docker compose -p local-ai-ci logs --no-color --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -p local-ai-ci down -v
