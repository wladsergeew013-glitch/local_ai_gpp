server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend_endpoint backend:8000;

  root /usr/share/nginx/html;
  index index.html;
  # 16 GiB model plus multipart metadata. Backend checks the file itself.
  client_max_body_size 16385m;
  client_body_timeout 210s;

  location / {
    try_files $uri /index.html;
  }

  location ~ ^/(api|v1|docs|redoc|openapi\.json)(/|$) {
    proxy_pass http://$backend_endpoint;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 210s;
  }

  location /assets/ {
    try_files $uri @model_assets;
  }

  location @model_assets {
    proxy_pass http://$backend_endpoint;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }
}
